<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div style="display:grid;grid-template-columns: 100px 100px">
        <div style="background-color: brown;">BOB</div>
        <div style="background-color: aqua;">SUPER</div>
        <p>thi is mine</p>
    </div>
    <div style="display:grid;grid-template-columns: 100px 100px 200px;margin-top:50px">
        <div style="background-color: brown;">100px</div>
        <div style="background-color: aqua;">100px</div>
        <div style="background-color: brown;">200px</div>
    </div>

    <div style="display:grid;grid-template-columns: 100px 1fr;margin-top:50px">
        <div style="background-color: brown;">100px</div>
        <div style="background-color: aqua;">1fr</div>
    </div>

    <div style="display:grid;grid-template-columns: 100px 1fr 2fr;margin-top:50px">
        <div style="background-color: brown;">100px</div>
        <div style="background-color: aqua;">1fr</div>
        <div style="background-color: brown;">2fr</div>
    </div>
        <div style="display:grid;grid-template-columns:  1fr 1fr 1fr;margin-top:50px; column-gap:20px; row-gap:40px">
        <div style="background-color: brown; height:200px">div1</div>
        <div style="background-color: aqua;">div2</div>
        <div style="background-color: brown;">div3</div>

        <div style="background-color: aqua; height:200px">div2</div>
        <div style="background-color: brown;">div3</div>
        <div style="background-color: aqua;">div2</div>
    </div>
</body>
</html>
